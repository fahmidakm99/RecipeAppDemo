<ion-header>
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/all-recipes"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ recipe?.name }}</ion-title>
    <!-- Edit icon -->
    <ion-buttons slot="end">
      <!-- <ion-button (click)="navigateToEditRecipe()"> -->
      <ion-button (click)="editRecipe(recipe)">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ recipe?.name }}</ion-card-title>
    </ion-card-header>
  
    <!-- Recipe Image -->
    <ion-card-content>
      <ion-img [src]="recipe?.image || 'assets/images/default.jpeg'" alt="Recipe Image"></ion-img>
    </ion-card-content>
  
    <!-- Categories -->
    <ion-card-header>
      <ion-card-subtitle>Categories: {{ recipe?.category?.join(', ') }}</ion-card-subtitle>
    </ion-card-header>
  
    <!-- Ingredients Section -->
    <ion-card-header>
      <ion-card-title>Ingredients</ion-card-title>
    </ion-card-header>
  
    <ion-card-content>
      <ion-list *ngIf="recipe?.ingredients && recipe.ingredients.length">
        <ion-item *ngFor="let ingredient of recipe.ingredients">
          <ion-label>{{ ingredient.name }}</ion-label>

        <!-- Dynamic Shopping Cart Icon -->
        <ion-icon 
        [name]="shoppingListService.isInShoppingList(ingredient) ? 'cart' : 'cart-outline'" 
        slot="end" 
        [color]="shoppingListService.isInShoppingList(ingredient) ? 'success' : 'primary'"
        (click)="shoppingListService.toggleIngredient(ingredient)">
      </ion-icon>

<!-- Shopping Cart Icon -->
          <!-- <ion-icon name="cart" slot="end" color="primary"></ion-icon>  -->
          
        </ion-item>
      </ion-list>
    </ion-card-content>
  
    <!-- Preparation Section -->
    <ion-card-header>
      <ion-card-title>Preparation</ion-card-title>
    </ion-card-header>
  
    <ion-card-content>
      <p class="preparation-text" >{{ recipe?.preparation }}</p>
    </ion-card-content>
  </ion-card>
  
</ion-content>
