<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">

    <!-- Menu Button -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title class="title">
      Home
    </ion-title>

      <!-- Favorites Icon -->
    <ion-buttons slot="end">
      <ion-button (click)="goToFavorites()">
        <ion-icon slot="icon-only" name="heart"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" >
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title class="title" size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

   <!-- Refresher Component -->
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle-outline"
      refreshingSpinner="crescent"
    >
    </ion-refresher-content>
  </ion-refresher>

 <!-- Swiper Carousel -->
  <div class="custom-slider">
    <div class="slides" [ngStyle]="{'transform': 'translateX(' + slideIndex * -100 + '%)'}">
      <div class="slide" *ngFor="let recipe of recipes" (click)="openRecipe(recipe.id)">
        <ion-card class="recipiecard">
          <ion-img class="imagesize" [src]="recipe.image"></ion-img>
          <div class="cardcontent">
            <ion-card-header>
              <ion-card-title class="recipieheading">{{ recipe.name }}</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              {{ recipe.description }}
            </ion-card-content>
          </div>
      
        </ion-card>
      </div>
    </div>

    <div class="slide-buttons">
      <button class="prev" (click)="prevSlide()">&lt;</button>
      <button class="nxt" (click)="nextSlide()">&gt;</button>
    </div>
  </div>

  <div class="quotes-container">
    <div class="quotes">
      {{ currentQuote }}
    </div>
  </div>
  <br><br>
  <ion-row class="button-container addall">
    <ion-col class="button-col">
      <ion-button class="add-recipe-button" expand="block" (click)="addRecipe()">
        <ion-icon name="add-circle"></ion-icon>
        Add Recipe</ion-button>
    </ion-col>
    <ion-col class="button-col">
      <ion-button class="all-recipe-button" expand="block" (click)="allRecipes()">
        <ion-icon name="fast-food"></ion-icon>
        All Recipes</ion-button>
    </ion-col>
  </ion-row>

</ion-content>
