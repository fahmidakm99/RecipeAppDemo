<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-title>
      Categories
    </ion-title>
<!-- Menu Button -->
<ion-buttons slot="start">
  <ion-menu-button></ion-menu-button>
</ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Categories</ion-title>
    </ion-toolbar>
  </ion-header> -->

 
  <ion-grid>
    <ion-row>
      
      <ion-col size="6" size-md="4" *ngFor="let category of categories">
        <div class="category-button" (click)="onCategoryClick(category.name)">

          <ion-img [src]="category.img" alt="{{category.name}}" class="category-image"></ion-img>
          <div class="category-label">{{ category.name }}</div>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>

 


</ion-content>
