<!-- Normal Login -->
<ion-content class="ion-padding login-container">
  <!-- Logo at the Top -->
  <div class="logo-container">
    <img
      src="assets/images/recipe-logo.png"
      alt="Recipe App Logo"
      class="app-logo"
    />
  </div>

  <!-- App Name -->
  <h1 class="app-title">Recipe App</h1>
  <p class="subtitle">Let's get started!</p>

  <!-- Login Form -->
   <!-- Login Form -->
   <ion-card class="login-card">
    <ion-card-content>
      <!-- Username Input -->
     
      <!-- Login Button (Only Visible If Password Field Is Shown) -->
      <ion-button expand="full" class="continue-button" *ngIf="showPasswordInput" (click)="login()">Login</ion-button>

    
      <!-- OR Divider -->
      <div class="or-divider"><span>OR</span></div>

      <!-- Google Sign-In Button -->
      <ion-button expand="full" color="dark" (click)="googleLogin()" class="google-button">
        <ion-icon slot="start" name="logo-google"></ion-icon> Sign in with Google
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
