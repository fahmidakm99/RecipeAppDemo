<ion-content class="ion-padding login-container">
  <!-- Logo at the Top -->
  <div class="logo-container">
    <img src="assets/images/recipe-logo.png" alt="Recipe App Logo" class="app-logo" />
  </div>

  <!-- App Name -->
  <h1 class="app-title">Recipe App</h1>
  <p class="subtitle">Let's get started!</p>

  <!-- Login Form -->
  <ion-card class="login-card">
    <ion-card-content>
      <form (ngSubmit)="loginUser(email, password)">
        <!-- Email Input -->
        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input [(ngModel)]="email" type="email" name="email" required></ion-input>
        </ion-item>

        <!-- Password Input -->
        <ion-item>
          <ion-label position="floating">Password</ion-label>
          <ion-input [(ngModel)]="password" type="password" name="password" required></ion-input>
        </ion-item>

        <!-- Login Button -->
        <ion-button class="custom-login-button" expand="full" type="submit">Login</ion-button>
        <p>Don't have an account? <a routerLink="/register">Register</a></p>

      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
