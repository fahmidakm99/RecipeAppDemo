<ion-header>
  <ion-toolbar class="toolbar">
    <!-- Back Button on the Left -->
    <ion-buttons slot="end">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>

    <!-- Centered Title -->
    <ion-title class="title">My Space</ion-title>

    <!-- Menu Button on the Right -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true" class="ion-padding">
  <h4 class="meal-title">Meal Planner</h4>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let day of weekDays">
        <ion-card [ngClass]="{'highlight-day': day.name === today}">
          <ion-card-header (click)="toggleDay(day)">
            <ion-card-title>{{ day.name }}</ion-card-title>
            <ion-icon [name]="day.expanded ? 'chevron-up' : 'chevron-down'"></ion-icon>
          </ion-card-header>
          <ion-card-content *ngIf="day.expanded">
            <ion-list>
              <ion-item *ngFor="let meal of mealTypes">
                <ion-label>
                  <strong>{{ meal }}</strong>
                  <p *ngIf="day.meals[meal]">{{ day.meals[meal] }}</p>
                </ion-label>
                <!-- <ion-button fill="outline" color="primary" (click)="openMealSelector(day.name, meal)"> -->
                  <ion-button fill="outline" class="meal-update" (click)="openInlineModal(day.name, meal)">

                  {{ day.meals[meal] ? 'Edit' : 'Add' }} Meal
                </ion-button>
             
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
