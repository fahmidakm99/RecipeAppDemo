<ion-app>

  <!-- Side Menu -->
  <ion-menu content-id="main-content" side="start">
    <ion-header>
      <ion-toolbar class="toolbar">
        <ion-title>Menu Content</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-item (click)="closeMenuAndNavigate('/tabs/home')">
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/tabs/favorites')">
          <ion-icon slot="start" name="heart"></ion-icon>
          <ion-label>Favorites</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/tabs/categories')">
          <ion-icon slot="start" name="shapes-outline"></ion-icon>
          <ion-label>Categories</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/tabs/shoppingList')">
          <ion-icon slot="start" name="cart-outline"></ion-icon>
          <ion-label>Shopping List</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/add-recipe')">
          <ion-icon slot="start" name="add-circle"></ion-icon>
          <ion-label>Add Recipe</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/all-recipes')">
          <ion-icon slot="start" name="fast-food"></ion-icon>
          <ion-label>All Recipes</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/my-space')">
          <ion-icon slot="start" name="happy-outline"></ion-icon>
          <!-- <img src="assets/images/meal.svg" alt="Logo" class="logo" /> -->
          <!-- <img src="assets/images/meal palnner.svg" alt="Logo" class="logo" /> -->
          <ion-label>My Space</ion-label>
        </ion-item>
        <ion-item (click)="logout('/login')">
          <ion-icon slot="start" name="log-out"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Main Content -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
  <ion-tabs></ion-tabs>
</ion-app>
