<ion-app>
  
  <!-- Side Menu -->
  <ion-menu content-id="main-content" side="start">
    <ion-header>
      <ion-toolbar class="toolbar" color="tertiary">
        <ion-title>Menu Content</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-item (click)="closeMenuAndNavigate('/recipie/home')">
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/favorites')">
          <ion-icon slot="start" name="heart"></ion-icon>
          <ion-label>Favorites</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/categories')">
          <ion-icon slot="start" name="shapes-outline"></ion-icon>
          <ion-label>Categories</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/shoppingList')">
          <ion-icon slot="start" name="cart-outline"></ion-icon>
          <ion-label>Shopping List</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/add-recipe')">
          <ion-icon slot="start" name="add-circle"></ion-icon>
          <ion-label>Add Recipe</ion-label>
        </ion-item>
        <ion-item (click)="closeMenuAndNavigate('/all-recipes')">
          <ion-icon slot="start" name="fast-food"></ion-icon>
          <ion-label>All Recipes</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Main Content -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
<ion-tabs></ion-tabs>
</ion-app>
